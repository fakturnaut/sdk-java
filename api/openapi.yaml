openapi: 3.1.0
info:
  description: "Issue, validate, deliver and check EN 16931 e-invoices (XRechnung,\
    \ ZUGFeRD, RO e-Factura). Authenticate with an API key as Bearer token. Test keys\
    \ (fkn_test_...) reach only the sandbox: documents marked as test, never billed,\
    \ deleted after 30 days."
  title: Fakturnaut API
  version: 1.0.0
servers:
- description: Fakturnaut
  url: https://api.fakturnaut.com/v1
security:
- bearer: []
- apiKey: []
paths:
  /api-keys:
    get:
      description: "Lists the tenant's keys, including revoked ones, without their\
        \ values."
      operationId: listApiKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ApiKeyResponse"
                type: array
                default: null
          description: "the keys, newest first"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Lists the tenant's keys, including revoked ones, without their values."
      tags:
      - API keys
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: Issues a key. The full key is in this response only; it is stored
        as a hash.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyRequest"
        description: "key name, scopes and mode"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
          description: 201 with the key including its full value
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Issues a key.
      tags:
      - API keys
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api-keys/{id}:
    delete:
      description: Revokes a key immediately; revoking twice is harmless.
      operationId: revokeApiKey
      parameters:
      - description: key identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
          description: the revoked key
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Revokes a key immediately; revoking twice is harmless.
      tags:
      - API keys
      x-accepts:
      - application/json
      - application/problem+json
  /deliveries/{id}:
    get:
      description: Returns one delivery.
      operationId: getDelivery
      parameters:
      - description: delivery
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
          description: the delivery
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Returns one delivery.
      tags:
      - Deliveries
      x-accepts:
      - application/json
      - application/problem+json
  /hello:
    get:
      description: Returns a greeting in the caller's preferred language.
      operationId: hello
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
          description: the greeting payload
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      security: []
      summary: Returns a greeting in the caller's preferred language.
      tags:
      - Status
      x-accepts:
      - application/json
      - application/problem+json
  /inbound/parse:
    post:
      description: |-
        Detects the format, reads and validates a received document, and returns a plain-language report with an
         HTML view.
      operationId: parseDocument
      parameters:
      - description: "<code>Accept-Language</code>; English if it starts with <code>en</code>,\
          \ else German"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/pdf:
            schema:
              format: binary
              type: string
          application/xml:
            schema:
              format: binary
              type: string
          text/xml:
            schema:
              format: binary
              type: string
        description: The file as the raw request body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionResponse"
          description: the report
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: |-
        Detects the format, reads and validates a received document, and returns a plain-language report with an
         HTML view.
      tags:
      - Inbound
      x-content-type: application/octet-stream
      x-accepts:
      - application/json
      - application/problem+json
  /inbound/render:
    post:
      description: Renders a received document as a readable PDF.
      operationId: renderDocument
      parameters:
      - description: "<code>Accept-Language</code>; English if it starts with <code>en</code>,\
          \ else German"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/pdf:
            schema:
              format: binary
              type: string
          application/xml:
            schema:
              format: binary
              type: string
          text/xml:
            schema:
              format: binary
              type: string
        description: The file as the raw request body
        required: true
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
          description: the PDF
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Renders a received document as a readable PDF.
      tags:
      - Inbound
      x-content-type: application/octet-stream
      x-accepts:
      - application/pdf
      - application/problem+json
  /invoices:
    get:
      description: "Lists the tenant's invoices, newest first."
      operationId: listInvoices
      parameters:
      - description: zero-based page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: "page size, 1 to 100"
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDtoInvoiceResponse"
          description: one page of invoices (without documents)
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Lists the tenant's invoices, newest first."
      tags:
      - Invoices
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: |-
        Issues an invoice: validates it, generates the requested formats, checks them officially and archives them.
         A repeated request with the same <code>Idempotency-Key</code> and body returns the original invoice.
      operationId: issueInvoice
      parameters:
      - description: optional idempotency key
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          description: "1 to 200 visible ASCII characters, e.g. a UUID"
          maxLength: 200
          minLength: 1
          pattern: "^[\\x21-\\x7E]{1,200}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRequest"
        description: invoice data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
          description: "A repeat with the same Idempotency-Key and body: the original\
            \ result, with header Idempotent-Replayed: true"
          headers:
            Idempotent-Replayed:
              description: true for a replayed result
              explode: false
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
          description: "201 with the archived invoice, or 200 with header <code>Idempotent-Replayed:\
            \ true</code> for a repeat"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Issues an invoice: validates it, generates the requested formats,\
        \ checks them officially and archives them."
      tags:
      - Invoices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /invoices/validate:
    post:
      description: Validates an invoice without issuing it and returns the calculated
        totals.
      operationId: validateInvoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRequest"
        description: invoice data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
          description: "the verdict, totals and all findings"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Validates an invoice without issuing it and returns the calculated
        totals.
      tags:
      - Invoices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /invoices/{id}:
    get:
      description: Returns an invoice with links to its documents.
      operationId: getInvoice
      parameters:
      - description: invoice identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
          description: the invoice
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Returns an invoice with links to its documents.
      tags:
      - Invoices
      x-accepts:
      - application/json
      - application/problem+json
  /invoices/{id}/document:
    get:
      description: Downloads an archived document exactly as issued.
      operationId: downloadInvoiceDocument
      parameters:
      - description: invoice identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "<code>xrechnung-ubl</code>, <code>xrechnung-cii</code>, <code>zugferd</code>,\
          \ <code>ro-efactura-ubl</code> or <code>ro-efactura-cii</code>"
        explode: true
        in: query
        name: format
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            application/xml:
              schema:
                format: binary
                type: string
          description: the document bytes with their media type; the ETag is the SHA-256
            of the content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Downloads an archived document exactly as issued.
      tags:
      - Invoices
      x-accepts:
      - application/pdf
      - application/problem+json
      - application/xml
  /invoices/{invoiceId}/deliveries:
    get:
      description: Lists the deliveries of an invoice.
      operationId: listInvoiceDeliveries
      parameters:
      - description: invoice
        explode: false
        in: path
        name: invoiceId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DeliveryResponse"
                type: array
                default: null
          description: "deliveries, oldest first"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Lists the deliveries of an invoice.
      tags:
      - Deliveries
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: |-
        Delivers an invoice. The response shows the status after the first attempt; later changes arrive as webhook
         events <code>delivery.updated</code> and via <code>GET /v1/deliveries/{id</code>}.
      operationId: deliverInvoice
      parameters:
      - description: invoice
        explode: false
        in: path
        name: invoiceId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: |-
          optional idempotency key; a repeat returns the first delivery (200,
               <code>Idempotent-Replayed: true</code>)
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          description: "1 to 200 visible ASCII characters, e.g. a UUID"
          maxLength: 200
          minLength: 1
          pattern: "^[\\x21-\\x7E]{1,200}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRequest"
        description: "channel, recipient and resend flag"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
          description: "A repeat with the same Idempotency-Key and body: the original\
            \ result, with header Idempotent-Replayed: true"
          headers:
            Idempotent-Replayed:
              description: true for a replayed result
              explode: false
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
          description: 201 with the delivery
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Delivers an invoice.
      tags:
      - Deliveries
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /received-documents:
    get:
      description: |-
        Lists received documents, newest first, optionally only one seller's, those received in a date range (calendar
         days in Germany, both inclusive) or those with a validation result.
      operationId: listReceivedDocuments
      parameters:
      - description: zero-based page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: "page size, 1 to 100"
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        style: form
      - description: only documents for this seller entity
        explode: true
        in: query
        name: sellerId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: received on or after this day
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: received on or before this day
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: only <code>valid</code> or <code>invalid</code> invoices and
          credit notes
        explode: true
        in: query
        name: validation
        required: false
        schema:
          enum:
          - valid
          - invalid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDtoReceivedDocumentResponse"
          description: one page
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: |-
        Lists received documents, newest first, optionally only one seller's, those received in a date range (calendar
         days in Germany, both inclusive) or those with a validation result.
      tags:
      - Received documents
      x-accepts:
      - application/json
      - application/problem+json
  /received-documents/{id}:
    get:
      description: Returns the metadata of a received document.
      operationId: getReceivedDocument
      parameters:
      - description: document
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedDocumentResponse"
          description: the metadata
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Returns the metadata of a received document.
      tags:
      - Received documents
      x-accepts:
      - application/json
      - application/problem+json
  /received-documents/{id}/content:
    get:
      description: Downloads a received document as received (UBL XML).
      operationId: downloadReceivedDocument
      parameters:
      - description: document
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/xml:
              schema:
                format: binary
                type: string
          description: the XML
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Downloads a received document as received (UBL XML).
      tags:
      - Received documents
      x-accepts:
      - application/problem+json
      - application/xml
  /received-documents/{id}/pdf:
    get:
      description: Renders a received invoice or credit note as a readable PDF.
      operationId: renderReceivedDocument
      parameters:
      - description: document
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "<code>Accept-Language</code>; English if it starts with <code>en</code>,\
          \ else German"
        explode: false
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: byte
                type: string
          description: the PDF
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Renders a received invoice or credit note as a readable PDF.
      tags:
      - Received documents
      x-accepts:
      - application/pdf
      - application/problem+json
  /received-documents/{id}/report:
    get:
      description: Returns the validation report stored with a received invoice or
        credit note.
      operationId: getReceivedDocumentReport
      parameters:
      - description: document
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedReportResponse"
          description: the report as it was when the document arrived
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Returns the validation report stored with a received invoice or credit
        note.
      tags:
      - Received documents
      x-accepts:
      - application/json
      - application/problem+json
  /sellers:
    get:
      description: Lists the tenant's seller entities by name.
      operationId: listSellers
      parameters:
      - description: zero-based page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: "page size, 1 to 100"
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDtoSellerResponse"
          description: one page
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Lists the tenant's seller entities by name.
      tags:
      - Sellers
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: "Creates a seller entity whose data is used on all its invoices,\
        \ and starts its verification."
      operationId: createSeller
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerRequest"
        description: seller data and the optional authorisation confirmation
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerResponse"
          description: 201 with the seller
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Creates a seller entity whose data is used on all its invoices, and\
        \ starts its verification."
      tags:
      - Sellers
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /sellers/{id}:
    get:
      description: Returns a seller entity.
      operationId: getSeller
      parameters:
      - description: seller identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerResponse"
          description: the seller
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Returns a seller entity.
      tags:
      - Sellers
      x-accepts:
      - application/json
      - application/problem+json
    put:
      description: |-
        Replaces a seller entity's data. Changing its name, VAT ID or Peppol address restarts the verification; with
         Peppol activated, a new VAT ID or register number goes to the access point, which asks for a new identity check.
      operationId: updateSeller
      parameters:
      - description: seller identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerRequest"
        description: new seller data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerResponse"
          description: the seller
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Replaces a seller entity's data.
      tags:
      - Sellers
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /sellers/{id}/attestation:
    post:
      description: Confirms that the seller authorised the tenant to issue and receive
        invoices on its behalf.
      operationId: attestSeller
      parameters:
      - description: seller identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationRequest"
        description: "<code>{&quot;confirmed&quot;: true</code>}"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSummary"
          description: the verification state after re-running the checks
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Confirms that the seller authorised the tenant to issue and receive
        invoices on its behalf.
      tags:
      - Sellers
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /sellers/{id}/documents:
    post:
      description: "Uploads a supporting document (PDF, PNG or JPEG, at most 10 MB)\
        \ as the raw request body."
      operationId: uploadSellerDocument
      parameters:
      - description: seller identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "<code>commercial-register</code>, <code>trade-registration</code>\
          \ or <code>signed-authorization</code>"
        explode: true
        in: query
        name: type
        required: true
        schema:
          type: string
        style: form
      - description: original file name
        explode: true
        in: query
        name: fileName
        required: false
        schema:
          default: document
          type: string
        style: form
      requestBody:
        content:
          application/pdf:
            schema:
              format: binary
              type: string
          image/jpeg:
            schema:
              format: binary
              type: string
          image/png:
            schema:
              format: binary
              type: string
        description: The file as the raw request body
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEntry"
          description: 201 with the stored document's metadata
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Uploads a supporting document (PDF, PNG or JPEG, at most 10 MB) as\
        \ the raw request body."
      tags:
      - Sellers
      x-content-type: application/pdf
      x-accepts:
      - application/json
      - application/problem+json
  /sellers/{id}/peppol:
    get:
      description: Returns a seller's Peppol registration.
      operationId: getSellerPeppol
      parameters:
      - description: seller
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeppolStatusResponse"
          description: the registration
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Returns a seller's Peppol registration.
      tags:
      - Sellers
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: |-
        Activates real Peppol for a seller: registers it at our Peppol access point for sending and, if asked for and
         nobody else serves its address, for receiving. Repeating the call returns the existing registration (200).
      operationId: activateSellerPeppol
      parameters:
      - description: seller
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeppolActivationRequest"
        description: whether the seller also wants to receive through us
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeppolStatusResponse"
          description: 201 with the registration and the identity-check link
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: |-
        Activates real Peppol for a seller: registers it at our Peppol access point for sending and, if asked for and
         nobody else serves its address, for receiving.
      tags:
      - Sellers
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /sellers/{id}/peppol/receiving:
    post:
      description: "Switches receiving through us on, if nobody else serves the seller's\
        \ Peppol address."
      operationId: enableSellerPeppolReceiving
      parameters:
      - description: seller
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeppolStatusResponse"
          description: the registration; <code>receivingBlocked</code> names the provider
            if another one serves the address
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Switches receiving through us on, if nobody else serves the seller's\
        \ Peppol address."
      tags:
      - Sellers
      x-accepts:
      - application/json
      - application/problem+json
  /sellers/{id}/peppol/verification:
    post:
      description: Asks the access point for a new identity-check link (the old one
        may be lost or expired).
      operationId: renewSellerPeppolVerification
      parameters:
      - description: seller
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeppolStatusResponse"
          description: the registration with the new link
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Asks the access point for a new identity-check link (the old one may
        be lost or expired).
      tags:
      - Sellers
      x-accepts:
      - application/json
      - application/problem+json
  /sellers/{id}/verification:
    get:
      description: "Returns the verification details: state, history, VAT ID checks\
        \ and uploaded documents."
      operationId: getSellerVerification
      parameters:
      - description: seller identifier
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponse"
          description: the details
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Returns the verification details: state, history, VAT ID checks and\
        \ uploaded documents."
      tags:
      - Sellers
      x-accepts:
      - application/json
      - application/problem+json
  /usage:
    get:
      description: Returns the usage of a month.
      operationId: getUsage
      parameters:
      - description: month as <code>YYYY-MM</code> (UTC); default the current month
        explode: true
        in: query
        name: period
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
          description: the counters
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Returns the usage of a month.
      tags:
      - Usage
      x-accepts:
      - application/json
      - application/problem+json
  /webhooks:
    get:
      description: Lists the endpoints without secrets.
      operationId: listWebhooks
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WebhookResponse"
                type: array
                default: null
          description: "endpoints, newest first"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Lists the endpoints without secrets.
      tags:
      - Webhooks
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: Registers an endpoint. The signing secret is in this response only.
      operationId: createWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
        description: target URL
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
          description: 201 with the endpoint and its secret
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Registers an endpoint.
      tags:
      - Webhooks
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /webhooks/{id}:
    delete:
      description: Removes an endpoint; no further events are sent to it.
      operationId: deleteWebhook
      parameters:
      - description: endpoint
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
          description: the removed endpoint
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Removes an endpoint; no further events are sent to it.
      tags:
      - Webhooks
      x-accepts:
      - application/json
      - application/problem+json
    patch:
      description: Changes an endpoint's URL or choice of events; the secret stays.
      operationId: updateWebhook
      parameters:
      - description: endpoint
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdateRequest"
        description: new URL and/or events
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
          description: the changed endpoint
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Changes an endpoint's URL or choice of events; the secret stays.
      tags:
      - Webhooks
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /webhooks/{id}/deliveries:
    get:
      description: "Shows the deliveries to an endpoint of the last 30 days, newest\
        \ first."
      operationId: listWebhookDeliveries
      parameters:
      - description: endpoint
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "maximum number, 1 to 100"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WebhookDeliveryResponse"
                type: array
                default: null
          description: "deliveries, newest first"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Shows the deliveries to an endpoint of the last 30 days, newest first."
      tags:
      - Webhooks
      x-accepts:
      - application/json
      - application/problem+json
  /webhooks/{id}/deliveries/{deliveryId}/resend:
    post:
      description: "Sends a finished delivery of the last 30 days again, as a new\
        \ delivery of the same event."
      operationId: resendWebhookDelivery
      parameters:
      - description: endpoint
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: delivery to send again
        explode: false
        in: path
        name: deliveryId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryResponse"
          description: Queued; it is sent within seconds
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Sends a finished delivery of the last 30 days again, as a new delivery\
        \ of the same event."
      tags:
      - Webhooks
      x-accepts:
      - application/json
      - application/problem+json
  /webhooks/{id}/rotate-secret:
    post:
      description: Gives an endpoint a new signing secret at once; the new secret
        is in this response only.
      operationId: rotateWebhookSecret
      parameters:
      - description: endpoint
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
          description: the endpoint with its new secret
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: Gives an endpoint a new signing secret at once; the new secret is in
        this response only.
      tags:
      - Webhooks
      x-accepts:
      - application/json
      - application/problem+json
  /webhooks/{id}/test:
    post:
      description: "Sends a <code>webhook.test</code> event to the endpoint within\
        \ seconds, whatever events it has chosen."
      operationId: testWebhook
      parameters:
      - description: endpoint
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryResponse"
          description: Queued; it is sent within seconds
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "An error as RFC 9457 problem with a stable code, e.g. invoice.invalid"
      summary: "Sends a <code>webhook.test</code> event to the endpoint within seconds,\
        \ whatever events it has chosen."
      tags:
      - Webhooks
      x-accepts:
      - application/json
      - application/problem+json
components:
  schemas:
    AddressDto:
      description: A postal address.
      properties:
        additionalStreet:
          description: additional line
          maxLength: 200
          minLength: 0
          type: string
        city:
          description: city
          maxLength: 100
          minLength: 0
          type: string
        country:
          description: ISO 3166-1 alpha-2 country code
          minLength: 1
          pattern: "[A-Za-z]{2}"
          type: string
        postCode:
          description: post code
          maxLength: 20
          minLength: 0
          type: string
        street:
          description: street and number
          maxLength: 200
          minLength: 0
          type: string
        subdivision:
          description: country subdivision
          maxLength: 100
          minLength: 0
          type: string
      required:
      - country
    AllowanceChargeDto:
      description: "An allowance or charge, on document or line level."
      example:
        amount: 0.08008281904610115
        baseAmount: 0.6027456183070403
        percentage: 0.14658129805029452
        reason: reason
        reasonCode: reasonCode
        vatCategory: vatCategory
        vatRate: 0.5962133916683182
      properties:
        amount:
          description: fixed amount; ignored if a percentage is given
          minimum: 0
          type: number
        baseAmount:
          description: base amount for the percentage
          minimum: 0
          type: number
        percentage:
          description: percentage of the base amount
          minimum: 0
          type: number
        reason:
          description: reason text
          maxLength: 200
          minLength: 0
          type: string
        reasonCode:
          description: UNTDID 5189 / 7161 reason code
          maxLength: 10
          minLength: 0
          type: string
        vatCategory:
          description: "VAT category code (document level only), default S"
          pattern: S|Z|E|AE|K|G|O|L|M
          type: string
        vatRate:
          description: VAT rate in percent (document level only)
          minimum: 0
          type: number
    ApiKeyRequest:
      description: Request to create an API key.
      example:
        mode: mode
        name: name
        scopes:
        - scopes
        - scopes
      properties:
        mode:
          description: |-
            <code>live</code> (default) or <code>test</code>: a test key (<code>fkn_test_...</code>) reaches only the sandbox
                 (ADR 0038) and has scope <code>invoices</code>
          pattern: live|test
          type: string
        name:
          description: "human-readable name, e.g. \"production\""
          maxLength: 100
          minLength: 0
          type: string
        scopes:
          description: <code>invoices</code> and/or <code>admin</code>; omitted or
            empty means <code>invoices</code>
          items:
            pattern: invoices|admin
            type: string
          maxItems: 2
          minItems: 0
          type: array
          default: null
      required:
      - name
    ApiKeyResponse:
      description: An API key.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        key: key
        lastUsedAt: 2000-01-23T04:56:07.000+00:00
        mode: mode
        name: name
        prefix: prefix
        revokedAt: 2000-01-23T04:56:07.000+00:00
        scopes:
        - scopes
        - scopes
      properties:
        createdAt:
          description: creation time
          format: date-time
          type: string
        id:
          description: identifier
          format: uuid
          type: string
        key:
          description: the full key; only present in the response that created it
          type: string
        lastUsedAt:
          description: last use (minute precision)
          format: date-time
          type: string
        mode:
          description: "<code>live</code> or <code>test</code> (sandbox only, ADR\
            \ 0038)"
          type: string
        name:
          description: name
          type: string
        prefix:
          description: "public prefix, e.g. <code>fkn_ab12cd34ef56</code>"
          type: string
        revokedAt:
          description: revocation time
          format: date-time
          type: string
        scopes:
          description: "what the key may do: <code>invoices</code> and/or <code>admin</code>"
          items:
            type: string
          type: array
          default: null
    AttestationRequest:
      description: |-
        Confirmation that the seller authorised the tenant to issue and receive invoices on its behalf. The confirmed
         text has version <code>seller-authorization-v1</code>.
      example:
        confirmed: true
      properties:
        confirmed:
          description: must be <code>true</code>
          type: boolean
      required:
      - confirmed
    ContactDto:
      description: Contact details.
      properties:
        email:
          description: e-mail address
          format: email
          maxLength: 200
          minLength: 0
          type: string
        name:
          description: contact person or department
          maxLength: 200
          minLength: 0
          type: string
        phone:
          description: telephone number
          maxLength: 50
          minLength: 0
          type: string
    DeliveryFailure:
      description: Why a Peppol delivery did not arrive.
      properties:
        code:
          description: |-
            stable code: <code>not-on-peppol</code>, <code>format-not-supported</code>, <code>validation</code>,
                 <code>transport</code>, <code>recipient-rejected</code>, <code>duplicate</code>, <code>sender-not-registered</code>,
                 <code>sender-not-verified</code> or <code>other</code>
          enum:
          - not-on-peppol
          - format-not-supported
          - validation
          - transport
          - recipient-rejected
          - duplicate
          - sender-not-registered
          - sender-not-verified
          - other
          type: string
        de:
          description: German explanation
          type: string
        en:
          description: English explanation
          type: string
    DeliveryRequest:
      description: Request to deliver an issued invoice.
      example:
        channel: channel
        fallbackEmail: fallbackEmail
        recipient: recipient
        resend: true
      properties:
        channel:
          description: "<code>peppol</code>, <code>email</code> or <code>anaf</code>"
          minLength: 1
          pattern: (?i)peppol|email|anaf
          type: string
        fallbackEmail:
          description: |-
            Peppol only: if the Peppol delivery fails (for example the buyer is not on Peppol), the
                 invoice is sent to this address by e-mail, with the usual e-mail rules
          maxLength: 320
          minLength: 0
          type: string
        recipient:
          description: |-
            Peppol participant ID (e.g. <code>9930:DE123456788</code> or <code>0204:991-33333TEST-33</code>), e-mail
                 address, or for ANAF the numeric CIF that receives ANAF's error messages. Optional for Peppol: without it the
                 buyer's electronic address in the invoice (BT-49) is used
          maxLength: 320
          minLength: 0
          type: string
        resend:
          description: <code>true</code> to deliver again to a recipient that already
            has a pending or successful delivery
          type: boolean
      required:
      - channel
    DeliveryResponse:
      description: A delivery of an invoice.
      example:
        channel: channel
        createdAt: 2000-01-23T04:56:07.000+00:00
        error: error
        externalId: externalId
        failure: ""
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        invoiceId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        peppol: ""
        recipient: recipient
        simulated: true
        status: status
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        channel:
          description: "<code>peppol</code>, <code>email</code> or <code>anaf</code>"
          type: string
        createdAt:
          description: creation time
          format: date-time
          type: string
        error:
          description: last error
          type: string
        externalId:
          description: "identifier at the channel (access point document ID, e-mail\
            \ Message-ID, ANAF upload index)"
          type: string
        failure:
          allOf:
          - $ref: "#/components/schemas/DeliveryFailure"
          description: "why a Peppol delivery did not arrive, if it did not"
        id:
          description: identifier
          format: uuid
          type: string
        invoiceId:
          description: delivered invoice
          format: uuid
          type: string
        peppol:
          allOf:
          - $ref: "#/components/schemas/PeppolReferences"
          description: "access point references of a real Peppol delivery, if any"
        recipient:
          description: recipient
          type: string
        simulated:
          description: <code>true</code> if nothing was really sent (simulated Peppol
            access point)
          type: boolean
        status:
          description: |-
            <code>PENDING</code>, <code>SENT</code>, <code>DELIVERED</code>, <code>REJECTED</code>, <code>UNCONFIRMED</code>,
                 <code>FAILED</code> or <code>OUTCOME_UNKNOWN</code> (the access point may have the invoice; it is looked for, never
                 resent blindly)
          type: string
        updatedAt:
          description: last status change
          format: date-time
          type: string
    DocumentDto:
      description: An archived document of an invoice.
      example:
        fileName: fileName
        format: format
        href: href
        mediaType: mediaType
        sha256: sha256
      properties:
        fileName:
          description: download file name
          type: string
        format:
          description: "<code>xrechnung-ubl</code>, <code>xrechnung-cii</code>, <code>zugferd</code>,\
            \ <code>ro-efactura-ubl</code> or <code>ro-efactura-cii</code>"
          type: string
        href:
          description: API path to download the document
          type: string
        mediaType:
          description: IANA media type
          type: string
        sha256:
          description: SHA-256 of the archived bytes (hex)
          type: string
    DocumentEntry:
      description: A supporting document (metadata only).
      example:
        fileName: fileName
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        mediaType: mediaType
        sha256: sha256
        size: 0
        type: type
        uploadedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        fileName:
          description: file name
          type: string
        id:
          description: identifier
          format: uuid
          type: string
        mediaType:
          description: media type detected from the content
          type: string
        sha256:
          description: SHA-256 of the content
          type: string
        size:
          description: bytes
          format: int64
          type: integer
        type:
          description: "<code>commercial-register</code>, <code>trade-registration</code>\
            \ or <code>signed-authorization</code>"
          type: string
        uploadedAt:
          description: upload time
          format: date-time
          type: string
    FindingDto:
      description: A validation finding.
      example:
        location: location
        message: ""
        ruleId: ruleId
        severity: severity
        source: source
      properties:
        location:
          description: business term or XPath the finding refers to
          type: string
        message:
          allOf:
          - $ref: "#/components/schemas/LocalizedText"
          description: plain-language explanation in German and English
        ruleId:
          description: "official or engine rule identifier, e.g. <code>BR-CO-10</code>"
          type: string
        severity:
          description: "<code>ERROR</code>, <code>WARNING</code> or <code>INFO</code>"
          type: string
        source:
          description: "<code>BUSINESS_RULES</code>, <code>XML_SCHEMA</code>, <code>SCHEMATRON</code>\
            \ or <code>DOCUMENT</code>"
          type: string
    HelloResponse:
      description: Response body of the hello endpoint.
      example:
        message: message
      properties:
        message:
          description: human-readable greeting
          type: string
    HistoryEntry:
      description: One status change.
      example:
        actor: actor
        at: 2000-01-23T04:56:07.000+00:00
        reason: reason
        status: status
      properties:
        actor:
          description: "who: <code>system</code>, <code>operator</code>, <code>api-key:&lt;prefix&gt;</code>\
            \ or <code>account:&lt;id&gt;</code>"
          type: string
        at:
          description: when
          format: date-time
          type: string
        reason:
          description: why
          type: string
        status:
          description: new status
          type: string
    InspectionResponse:
      description: Result of checking a received document.
      example:
        findings:
        - location: location
          message: ""
          ruleId: ruleId
          severity: severity
          source: source
        - location: location
          message: ""
          ruleId: ruleId
          severity: severity
          source: source
        format: ""
        html: html
        invoice: ""
        summary: ""
        valid: true
      properties:
        findings:
          description: all findings
          items:
            $ref: "#/components/schemas/FindingDto"
          type: array
          default: null
        format:
          allOf:
          - $ref: "#/components/schemas/LocalizedText"
          description: "detected format, e.g. \"XRechnung (UBL)\"; <code>null</code>\
            \ if unreadable"
        html:
          description: readable HTML view; <code>null</code> if unreadable
          type: string
        invoice:
          allOf:
          - $ref: "#/components/schemas/InvoiceSummaryDto"
          description: key data; <code>null</code> if unreadable
        summary:
          allOf:
          - $ref: "#/components/schemas/LocalizedText"
          description: plain-language verdict
        valid:
          description: <code>true</code> if the document is a valid e-invoice
          type: boolean
