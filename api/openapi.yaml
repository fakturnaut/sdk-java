    ReceivedDocumentResponse:
      description: A document received over Peppol.
      example:
        documentType: documentType
        href: href
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        kind: invoice
        messageId: messageId
        pdfHref: pdfHref
        receivedAt: 2000-01-23T04:56:07.000+00:00
        reportHref: reportHref
        sellerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        sender: sender
        validation: valid
      properties:
        documentType:
          description: Peppol document type
          type: string
        href:
          description: API path to download the document as received
          type: string
        id:
          description: identifier
          format: uuid
          type: string
        kind:
          description: |-
            <code>invoice</code>, <code>credit-note</code>, <code>other</code> (orders, responses, ...) or <code>document</code>
                 (received before documents were classified)
          enum:
          - invoice
          - credit-note
          - other
          - document
          type: string
        messageId:
          description: access point message identifier
          type: string
        pdfHref:
          description: "API path of a readable PDF view, for invoices and credit notes"
          type: string
        receivedAt:
          description: time of receipt
          format: date-time
          type: string
        reportHref:
          description: "API path of the validation report, if one is stored"
          type: string
        sellerId:
          description: receiving seller entity
          format: uuid
          type: string
        sender:
          description: sending participant
          type: string
        validation:
          description: "our validation result for invoices and credit notes: <code>valid</code>\
            \ or <code>invalid</code>"
          enum:
          - valid
          - invalid
          type: string
    ReceivedReportResponse:
      description: "The validation report stored with a received invoice or credit\
        \ note, as it was when the document arrived."
      example:
        findings:
        - location: location
          message: ""
          ruleId: ruleId
          severity: severity
          source: source
        - location: location
          message: ""
          ruleId: ruleId
          severity: severity
          source: source
        valid: true
      properties:
        findings:
          description: the findings
          items:
            $ref: "#/components/schemas/FindingDto"
          type: array
          default: null
        valid:
          description: whether no error was found
          type: boolean
    SellerRequest:
      description: Request to create a seller entity.
      example:
        accountName: accountName
        authorizationConfirmed: true
        bic: bic
        iban: iban
        party: ""
      properties:
        accountName:
          description: holder of the default account
          maxLength: 200
          minLength: 0
          type: string
        authorizationConfirmed:
          description: |-
            <code>true</code> to confirm that the seller authorised the tenant to issue and
                 receive invoices on its behalf (attestation <code>seller-authorization-v1</code>, needed for verification)
          type: boolean
        bic:
          description: BIC of the default account
          maxLength: 11
          minLength: 0
          type: string
        iban:
          description: default account for SEPA credit transfer
          maxLength: 40
          minLength: 0
          type: string
        party:
          allOf:
          - $ref: "#/components/schemas/PartyDto"
          description: seller party data (BG-4)
      required:
      - party
    SellerResponse:
      description: A seller entity.
      example:
        accountName: accountName
        bic: bic
        createdAt: 2000-01-23T04:56:07.000+00:00
        iban: iban
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        party: ""
        verification: ""
      properties:
        accountName:
          description: holder of the default account
          type: string
        bic:
          description: BIC of the default account
          type: string
        createdAt:
          description: creation time
          format: date-time
          type: string
        iban:
          description: default account
          type: string
        id:
          description: identifier
          format: uuid
          type: string
        party:
          allOf:
          - $ref: "#/components/schemas/PartyDto"
          description: seller party data
        verification:
          allOf:
          - $ref: "#/components/schemas/VerificationSummary"
          description: "verification state (real Peppol needs <code>verified</code>,\
            \ ADR 0012)"
    TaxRepresentativeDto:
      description: Seller tax representative (BG-11).
      properties:
        address:
          allOf:
          - $ref: "#/components/schemas/AddressDto"
          description: postal address (BG-12)
        name:
          description: name (BT-62)
          maxLength: 200
          minLength: 0
          type: string
        vatId:
          description: VAT identifier with country prefix (BT-63)
          maxLength: 30
          minLength: 0
          type: string
      required:
      - address
      - name
      - vatId
    TotalsDto:
      description: Calculated document totals (BG-22).
      properties:
        allowanceTotal:
          description: sum of document allowances (BT-107)
          type: number
        amountDue:
          description: amount due for payment (BT-115)
          type: number
        chargeTotal:
          description: sum of document charges (BT-108)
          type: number
        lineNetTotal:
          description: sum of line net amounts (BT-106)
          type: number
        prepaidAmount:
          description: paid amount (BT-113)
          type: number
        taxExclusiveAmount:
          description: total without VAT (BT-109)
          type: number
        taxInclusiveAmount:
          description: total with VAT (BT-112)
          type: number
        vatTotal:
          description: total VAT (BT-110)
          type: number
    UsageResponse:
      description: Usage of one calendar month.
      example:
        activeSellers: 0
        inboundParsed: 6
        invoicesIssued: 1
        invoicesValidated: 5
        period: period
      properties:
        activeSellers:
          description: seller entities that issued at least one invoice
          format: int64
          type: integer
        inboundParsed:
          description: received documents checked
          format: int64
          type: integer
        invoicesIssued:
          description: issued invoices
          format: int64
          type: integer
        invoicesValidated:
          description: validations without issuing
          format: int64
          type: integer
        period:
          description: "month, <code>YYYY-MM</code> (UTC)"
          type: string
    ValidationResponse:
      description: Result of validating an invoice without issuing it.
      example:
        findings:
        - location: location
          message: ""
          ruleId: ruleId
          severity: severity
          source: source
        - location: location
          message: ""
          ruleId: ruleId
          severity: severity
          source: source
        summary: ""
        totals: ""
        valid: true
      properties:
        findings:
          description: all findings
          items:
            $ref: "#/components/schemas/FindingDto"
          type: array
          default: null
        summary:
          allOf:
          - $ref: "#/components/schemas/LocalizedText"
          description: plain-language verdict
        totals:
          allOf:
          - $ref: "#/components/schemas/TotalsDto"
          description: calculated totals
        valid:
          description: <code>true</code> if the invoice has no error and could be
            issued
          type: boolean
    VatAccountingDto:
      description: "VAT accounting currency (BT-6) and the invoice total VAT amount\
        \ in it (BT-111), converted by the issuer."
      properties:
        currency:
          description: ISO 4217 code of the VAT accounting currency
          pattern: "[A-Z]{3}"
          type: string
        vatTotal:
          description: "total VAT amount in that currency, two decimals"
          type: number
      required:
      - currency
      - vatTotal
    VatCheckEntry:
      description: One VAT ID check.
      example:
        cached: true
        checkedAt: 2000-01-23T04:56:07.000+00:00
        errorCode: errorCode
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        nameScore: 0
        outcome: outcome
        registeredName: registeredName
        requestIdentifier: requestIdentifier
        vatId: vatId
      properties:
        cached:
          description: whether an answer from the last 24 hours was reused
          type: boolean
        checkedAt:
          description: when it was checked
          format: date-time
          type: string
        errorCode:
          description: the registry's error code when unavailable
          type: string
        id:
          description: identifier
          format: uuid
          type: string
        nameScore:
          description: "similarity 0–100 with the seller's name, if a name came back"
          format: int32
          type: integer
        outcome:
          description: "<code>valid</code>, <code>invalid</code>, <code>malformed</code>\
            \ or <code>unavailable</code>"
          type: string
        registeredName:
          description: "name the registry returned, if any"
          type: string
        requestIdentifier:
          description: "the registry's consultation reference, if any"
          type: string
        vatId:
          description: checked VAT ID
          type: string
    VatExemptionDto:
      description: A VAT exemption reason for one category.
      example:
        category: category
        code: code
        reason: reason
      properties:
        category:
          description: VAT category code
          minLength: 1
          pattern: E|AE|K|G|O
          type: string
        code:
          description: VATEX code
          maxLength: 30
          minLength: 0
          type: string
        reason:
          description: exemption reason text
          maxLength: 300
          minLength: 0
          type: string
      required:
      - category
    VerificationResponse:
      description: Full verification details of a seller.
      example:
        attestationVersion: attestationVersion
        attestedAt: 2000-01-23T04:56:07.000+00:00
        checks:
        - cached: true
          checkedAt: 2000-01-23T04:56:07.000+00:00
          errorCode: errorCode
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          nameScore: 0
          outcome: outcome
          registeredName: registeredName
          requestIdentifier: requestIdentifier
          vatId: vatId
        - cached: true
          checkedAt: 2000-01-23T04:56:07.000+00:00
          errorCode: errorCode
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          nameScore: 0
          outcome: outcome
          registeredName: registeredName
          requestIdentifier: requestIdentifier
          vatId: vatId
        documents:
        - fileName: fileName
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          mediaType: mediaType
          sha256: sha256
          size: 0
          type: type
          uploadedAt: 2000-01-23T04:56:07.000+00:00
        - fileName: fileName
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          mediaType: mediaType
          sha256: sha256
          size: 0
          type: type
          uploadedAt: 2000-01-23T04:56:07.000+00:00
        history:
        - actor: actor
          at: 2000-01-23T04:56:07.000+00:00
          reason: reason
          status: status
        - actor: actor
          at: 2000-01-23T04:56:07.000+00:00
          reason: reason
          status: status
        verification: ""
      properties:
        attestationVersion:
          description: "version of the confirmed text, if attested"
          type: string
        attestedAt:
          description: "when the tenant confirmed, if attested"
          format: date-time
          type: string
        checks:
          description: "VAT ID checks, newest first"
          items:
            $ref: "#/components/schemas/VatCheckEntry"
          type: array
          default: null
        documents:
          description: "supporting documents, newest first"
          items:
            $ref: "#/components/schemas/DocumentEntry"
          type: array
          default: null
        history:
          description: "status changes, oldest first"
          items:
            $ref: "#/components/schemas/HistoryEntry"
          type: array
          default: null
        verification:
          allOf:
          - $ref: "#/components/schemas/VerificationSummary"
          description: current state
    VerificationSummary:
      description: Short verification state of a seller.
      example:
        attested: true
        partnerCheck: partnerCheck
        reason: reason
        since: 2000-01-23T04:56:07.000+00:00
        status: status
      properties:
        attested:
          description: whether the tenant confirmed the seller's authorisation
          type: boolean
        partnerCheck:
          description: |-
            the access point partner's identity check: <code>unknown</code>, <code>pending</code>,
                 <code>passed</code> or <code>failed</code>
          type: string
        reason:
          description: "why (stable codes such as <code>vies.unavailable</code>, or\
            \ the operator's text)"
          type: string
        since:
          description: when the status was set
          format: date-time
          type: string
        status:
          description: "<code>unverified</code>, <code>pending_review</code>, <code>verified</code>\
            \ or <code>rejected</code>"
          type: string
    WebhookDeliveryResponse:
      description: One entry of a webhook endpoint's delivery log.
      example:
        attempts: 0
        createdAt: 2000-01-23T04:56:07.000+00:00
        eventId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        eventType: eventType
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        lastError: lastError
        lastStatusCode: 6
        nextAttemptAt: 2000-01-23T04:56:07.000+00:00
        status: status
      properties:
        attempts:
          description: attempts so far
          format: int32
          type: integer
        createdAt:
          description: creation time
          format: date-time
          type: string
        eventId:
          description: event identifier
          format: uuid
          type: string
        eventType:
          description: event type
          type: string
        id:
          description: identifier
          format: uuid
          type: string
        lastError:
          description: error of the last attempt
          type: string
        lastStatusCode:
          description: HTTP status of the last attempt
          format: int32
          type: integer
        nextAttemptAt:
          description: next attempt (pending only)
          format: date-time
          type: string
        status:
          description: "<code>PENDING</code>, <code>DELIVERED</code> or <code>FAILED</code>"
          type: string
    WebhookRequest:
      description: Request to register a webhook endpoint.
      example:
        events:
        - invoice.issued
        - invoice.issued
        - invoice.issued
        - invoice.issued
        - invoice.issued
        url: url
      properties:
        events:
          description: |-
            event types it receives: <code>invoice.issued</code>, <code>delivery.updated</code>,
                 <code>document.received</code>, <code>seller.status_changed</code>, <code>invoice.received</code>; omitted or empty means
                 all
          items:
            enum:
            - invoice.issued
            - delivery.updated
            - document.received
            - seller.status_changed
            - invoice.received
            minLength: 1
            type: string
          maxItems: 10
          minItems: 0
          type: array
          default: null
        url:
          description: https URL
          maxLength: 500
          minLength: 0
          type: string
      required:
      - url
    WebhookResponse:
      description: A webhook endpoint.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        disabledAt: 2000-01-23T04:56:07.000+00:00
        events:
        - events
        - events
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        secret: secret
        url: url
      properties:
        createdAt:
          description: creation time
          format: date-time
          type: string
        disabledAt:
          description: removal time
          format: date-time
          type: string
        events:
          description: event types it receives; empty means all
          items:
            type: string
          type: array
          default: null
        id:
          description: identifier
          format: uuid
          type: string
        secret:
          description: signing secret; only in the response that created the endpoint
            or rotated its secret
          type: string
        url:
          description: target URL
          type: string
    WebhookUpdateRequest:
      description: Request to change a webhook endpoint; omitted fields stay as they
        are.
      example:
        events:
        - invoice.issued
        - invoice.issued
        - invoice.issued
        - invoice.issued
        - invoice.issued
        url: url
      properties:
        events:
          description: new event types; an empty list means all
          items:
            enum:
            - invoice.issued
            - delivery.updated
            - document.received
            - seller.status_changed
            - invoice.received
            minLength: 1
            type: string
          maxItems: 10
          minItems: 0
          type: array
          default: null
        url:
          description: new https URL
          maxLength: 500
          minLength: 0
          type: string
    Problem_accessPoint:
      description: "Optional, only on Peppol refusals (codes peppol.*) and only for\
        \ API keys with scope admin: what the Peppol access point answered. For diagnosis\
        \ by a person; the text is not stable and may change at any time, so never\
        \ parse it: use code."
      properties:
        message:
          description: "The access point's own text in English, at most 300 characters;\
            \ references to its support and its own e-mail addresses and URLs are\
            \ removed as far as recognised; may be empty"
          type: string
        status:
          description: HTTP status the Peppol access point answered with
          format: int32
          type: integer
    Problem_errors_inner:
      properties:
        field:
          description: Path of the invalid field
          type: string
        message:
          description: What is wrong with it
          type: string
  securitySchemes:
    apiKey:
      in: header
      name: X-API-Key
      type: apiKey
    bearer:
      description: "API key fkn_… (older keys: eih_…)"
      scheme: bearer
      type: http

