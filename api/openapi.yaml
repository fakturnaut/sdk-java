    PeppolStatusResponse:
      description: A seller's Peppol registration.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        explanation: ""
        receiveRequested: true
        receiving: true
        receivingBlocked: ""
        status: pending
        statusChangedAt: 2000-01-23T04:56:07.000+00:00
        statusMessage: statusMessage
        statusReason: identifiers-pending
        updatedAt: 2000-01-23T04:56:07.000+00:00
        verificationUrl: verificationUrl
      properties:
        createdAt:
          description: when Peppol was activated
          format: date-time
          type: string
        explanation:
          allOf:
          - $ref: "#/components/schemas/PeppolTexts"
          description: "who must open the link, and why"
        receiveRequested:
          description: whether the seller asked to receive through us
          type: boolean
        receiving:
          description: whether the seller is registered to receive Peppol invoices
            through us
          type: boolean
        receivingBlocked:
          allOf:
          - $ref: "#/components/schemas/PeppolReceivingBlocked"
          description: why receiving is off although requested
        status:
          description: |-
            the access point's identity check: <code>pending</code>, <code>verified</code>, <code>rejected</code> or
                 <code>error</code>
          enum:
          - pending
          - verified
          - rejected
          - error
          type: string
        statusChangedAt:
          description: when the identity check last changed
          format: date-time
          type: string
        statusMessage:
          description: "the message behind <code>statusReason</code>, in English"
          type: string
        statusReason:
          description: |-
            why the status is <code>error</code>: <code>identifiers-pending</code> (a new VAT ID or register
                 number has not reached the access point yet; retried), <code>identifiers-invalid</code> (the new identifiers
                 cannot be used for Peppol), <code>identifiers-refused</code> (the access point refused them; correct the seller),
                 or <code>access-point</code> (the access point's own message)
          enum:
          - identifiers-pending
          - identifiers-invalid
          - identifiers-refused
          - access-point
          type: string
        updatedAt:
          description: last change
          format: date-time
          type: string
        verificationUrl:
          description: |-
            the link an authorised representative opens for the identity check; only for keys with
                 scope <code>admin</code> and while the check is not verified
          type: string
